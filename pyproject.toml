[project]
name = "lbb"
version = "0.1.0"
description = "LightBurn Bridge — SKU-aware PDF loader for LightBurn"
readme = "README.md"
authors = [
    { name = "gabriel-tutor", email = "gabdotcode01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.2",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
ui = [
    # Essentials = QtCore/QtGui/QtWidgets (~105MB). The full PySide6 meta-package
    # adds 316MB of Addons (WebEngine, Multimedia, Qt3D, etc.) we don't use.
    "PySide6-Essentials>=6.7",
    "pytest-qt>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "fpdf2>=2.7",  # generates deterministic vector PDF fixtures
]

[project.scripts]
lbb = "lbb.__main__:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLR0913", "S101"]  # tests: magic numbers, many args, assert OK

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: requires real LightBurn instance (skipped in CI by default)",
]
