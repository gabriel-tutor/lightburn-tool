name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual triggers so you can rebuild without pushing

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run lint-imports
      - run: uv run pytest -m "not e2e"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --extra ui --dev
      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/lbb.spec --clean --noconfirm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightburn-bridge-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
